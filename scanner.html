<body id="main-body">

  <div id="lock-screen">

  <div class="container py-3 text-center">
    
    <div id="header-ui" class="mb-3 shadow-lg">
      <img src="https://dzqhjifxtgeynsqlxahw.supabase.co/storage/v1/object/public/LOGO/Logo.png" class="logo-img" alt="Logo">

      <div id="loading-scanner" class="d-none my-4">
        <div class="spinner-border text-success" role="status"></div>

      </div>

    </div>

    <div class="mt-4" id="footer-ui">
       <button class="btn btn-outline-light btn-sm opacity-25 border-0" onclick="ricaricaPagina()">Reset Camera</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      evento: "<?= eventoCodice ?>",
      staff: "<?= nicknameStaff ?>"
    };

    // Funzione "corazzata" per ricaricare la pagina
    // Usa l'URL dinamico dello script corrente per evitare link rotti
    function ricaricaPagina() {
      const baseUrl = "<?= ScriptApp.getService().getUrl() ?>";
      const url = baseUrl + "?page=scanner&evento=" + CONFIG.evento + "&staff=" + CONFIG.staff;
      window.top.location.href = url;
    }

    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('display-evento').innerText = res.nomeEvento || CONFIG.evento;
          document.getElementById('display-staff').innerText = "STAFF: " + (res.nomeStaff || CONFIG.staff);

          if (res.authorized) {
            // Nota: ho corretto la logica "troppoPresto" che nel tuo codice chiamava renderStatusMessage con 3 argomenti
            // ma la funzione sotto ne accettava 3. Tutto corretto.
            if (res.troppoPresto) {
              renderStatusMessage("🕒 ACCESSO ANTICIPATO", `Il check-in apre alle ore <b>${res.oraApertura}</b>`, "#1db954");
            } else {
              document.getElementById('lock-screen').classList.add('d-none');
              document.getElementById('reader-container').classList.remove('d-none');
              // Questo avvia lo scanner se la funzione è caricata da js_scanner
              if (typeof initScanner === "function") initScanner();
            }
          } else {
            renderStatusMessage("⚠️ ATTENZIONE", res.msg || "Accesso non autorizzato", "#ff4444");
          }
        })
        .withFailureHandler(function(err) {
          renderStatusMessage("❌ ERRORE", "Errore di connessione al database: " + err.message, "#ff4444");
        })
        .verificaAccessoScanner(CONFIG.evento, CONFIG.staff);
    };

    function renderStatusMessage(titolo, messaggio, colore) {
      document.getElementById('lock-screen').classList.add('d-none');
      document.getElementById('main-content-area').innerHTML = `
        <div class="status-card shadow-lg mx-2">
          <h2 class="fw-bold" style="color: ${colore}">${titolo}</h2>
          <p class="fs-5 text-white mt-3">${messaggio}</p>
          <button class="btn btn-light mt-4 fw-bold" style="border-radius:15px; padding: 10px 25px;" onclick="ricaricaPagina()">RIPROVA</button>
        </div>
      `;
    }
  </script>
