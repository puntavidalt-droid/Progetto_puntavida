<html>
  <head>

    <div class="container py-5 d-flex justify-content-center">
      <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
        
        <div class="text-center p-4">
          <img src="<?= eventoInfo.logoUrl ?>" alt="Logo" class="logo-img">
          <h4 class="titolo-evento mb-0 fw-bold"><?= eventoInfo.nome ?></h4>
          <p class="sottotitolo-staff mb-0">PR: <?= prNickname ?></p>
        </div>
        
        <div class="card-body p-4">
          
          <? if (eventoInfo.stato === "CHIUSO") { ?>
            <div class="text-center py-4">
              <div class="status-icon">⌛</div>
              <h5 class="fw-bold text-uppercase">Prenotazioni Chiuse</h5>
              <p class="small">L'evento non accetta più iscrizioni.</p>
            </div>
          <? } else if (eventoInfo.stato === "SOLDOUT") { ?>
            <div class="text-center py-4">
              <div class="status-icon">🔥</div>
              <h5 class="fw-bold text-uppercase text-danger">Sold Out</h5>
              <p class="small">Posti esauriti! Ci vediamo al prossimo evento.</p>
            </div>
          <? } else { ?>
            
            <div id="form-box">
              <p class="text-center small mb-4">Compila i campi per ricevere il tuo pass via email.</p>
              
              <div class="mb-3">
                <input type="text" id="nome" class="form-control" placeholder="Nome">
              </div>
              <div class="mb-3">
                <input type="text" id="cognome" class="form-control" placeholder="Cognome">
              </div>
              <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Indirizzo Email" required>
              </div>
              
              <button id="btn-invia" class="btn btn-registrazione w-100 py-2 fw-bold" onclick="inviaDati()">
                REGISTRATI ORA
              </button>
            </div>

            <div id="loading-box" class="d-none text-center py-4">
              <div class="spinner-border text-light" role="status"></div>
              <p class="mt-2 small">Elaborazione in corso...</p>
            </div>

            <div id="success-box" class="d-none text-center">
              <div class="alert alert-success small fw-bold">PRENOTAZIONE EFFETTUATA!</div>
              <p class="small">Salva questo QR Code e mostralo all'ingresso.</p>
              <div id="qrcode" class="d-flex justify-content-center mb-4 border p-2 bg-white"></div>

               <button class="btn btn-outline-light btn-sm mt-3" onclick="ripristinaForm()">RIPROVA</button>
            </div>

          <? } ?>

        </div>
      </div>
    </div>
