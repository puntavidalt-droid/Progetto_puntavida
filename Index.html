<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Punta Vida</title>

    <!-- Open Graph per WhatsApp/Social -->
    <meta property="og:title" content="Punta Vida Official">
    <meta property="og:description" content="Sistema di prenotazione eventi. Accedi all'area riservata o registrati.">
    <meta property="og:image" content="https://dzqhjifxtgeynsqlxahw.supabase.co/storage/v1/object/public/LOGO/Logo.png">
    <meta property="og:url" content="https://comfy-tartufo-500ca9.netlify.app">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://dzqhjifxtgeynsqlxahw.supabase.co/storage/v1/object/public/LOGO/Logo.png">

    <!-- ✅ PWA: Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- ✅ PWA: Apple / iOS -->
    <link rel="apple-touch-icon" href="https://dzqhjifxtgeynsqlxahw.supabase.co/storage/v1/object/public/LOGO/Logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PuntaVida">

    <!-- ✅ PWA: Theme color -->
    <meta name="theme-color" content="#000000">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Splash screen mostrato durante il caricamento */
        #splash {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .logo-text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 2.5rem;
            font-weight: bold;
            color: #1ed760;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(30, 215, 96, 0.15);
            border-top-color: #1ed760;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.04); }
        }

        /* ✅ L'iframe occupa tutto lo schermo — nessun redirect, l'utente resta su Netlify */
        #appFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>

    <!-- Splash screen animato -->
    <div id="splash">
        <div class="logo-text">★ PUNTA VIDA</div>
        <div class="spinner"></div>
    </div>

    <!-- 
        ✅ IFRAME: l'app Apps Script gira qui dentro.
        L'utente resta su comfy-tartufo-500ca9.netlify.app → la PWA funziona!
    -->
    <iframe id="appFrame" src="" allowfullscreen></iframe>

    <script>
        // ========================================
        // CONFIGURAZIONE
        // ========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5L3NcAJJ7_3wm474L4L008mg3FLDBtzPxwHoNq_zdMao-22fnTE5vC8HB4dgrNjtL/exec";

        // ========================================
        // COSTRUZIONE URL IFRAME
        // Mantiene tutti i parametri del link originale (page, pr, evento, ecc.)
        // ========================================
        function buildIframeUrl() {
            const params = new URLSearchParams(window.location.search);
            const hash   = window.location.hash;

            // Se nessun parametro → vai alla registrazione di default
            if (!params.toString() && !hash) {
                params.set('page', 'registrazione');
            }

            return GOOGLE_SCRIPT_URL + '?' + params.toString() + hash;
        }

        // ========================================
        // INIZIALIZZAZIONE
        // ========================================
        window.addEventListener('load', function () {
            const frame  = document.getElementById('appFrame');
            const splash = document.getElementById('splash');

            // Imposta la src dell'iframe con i parametri corretti
            frame.src = buildIframeUrl();

            // Nascondi lo splash quando l'iframe è caricato
            frame.addEventListener('load', function () {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 600);
            });

            // Timeout di sicurezza: nascondi splash dopo 8s anche se l'iframe tarda
            setTimeout(() => {
                if (document.getElementById('splash')) {
                    splash.classList.add('fade-out');
                    setTimeout(() => splash.remove(), 600);
                }
            }, 8000);
        });

        // ========================================
        // ✅ REGISTRAZIONE SERVICE WORKER (PWA)
        // ========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ Service Worker registrato:', reg.scope))
                    .catch(err => console.warn('⚠️ Service Worker errore:', err));
            });
        }
    </script>

</body>
</html>
