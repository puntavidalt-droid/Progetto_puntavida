  <style>
    :root { --sidebar-width: 260px; --accent-color: #1ed760; }
    body { background-color: #000; color: #fff; min-height: 100vh; display: flex; margin: 0; overflow-x: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* SIDEBAR PC */
    #sidebar {

  <script>
    window.utenteLoggato = null;
    let moduloCorrente = 'home';

    // Security Check
    (function() {
      const sessione = localStorage.getItem('sessione_punta_vida');
      if (!sessione) { logout(); return; }
      window.utenteLoggato = JSON.parse(sessione);
      document.getElementById('user-display').innerText = "User: " + window.utenteLoggato.nickname;
    })();

    function logout() {
      localStorage.removeItem('sessione_punta_vida');
      const url = "<?= ScriptApp.getService().getUrl() ?>?page=login";
      window.location.href = url;
    }

    // Navigazione Mobile
    function caricaDaMobile(modulo, el) {
      document.querySelectorAll('.mobile-nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      cambiaVista(modulo);
    }

    function apriScanner() {
       window.location.href = "<?= ScriptApp.getService().getUrl() ?>?page=scanner";
    }

    // Caricamento Moduli
    function cambiaVista(modulo, element) {
      if (modulo === 'staff' && !window.utenteLoggato.is_admin) return;

      const container = document.getElementById('modulo-container');
      if (element) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        element.classList.add('active');
      }

      container.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-success"></div></div>';

      google.script.run
        .withSuccessHandler(html => {
          container.innerHTML = html;
          
          // Esecuzione Script del modulo caricato (Senza duplicazioni)
          const scripts = container.querySelectorAll("script");
          scripts.forEach(oldScript => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.text = oldScript.innerHTML;
            document.body.appendChild(newScript).parentNode.removeChild(newScript);
          });

          // Avvio funzioni specifiche
         // Sostituisci il blocco initMap con questo:
          setTimeout(() => {
            const initMap = {
              'home': 'caricaHome',
              'eventi': 'caricaEventi',
              'pr': 'caricaPR',
              'staff': 'caricaStaff', // <--- RIGA AGGIUNTA
              'gestione_prenotazioni': 'inizializzaGestione'
            };
            if (window[initMap[modulo]]) window[initMap[modulo]]();
          }, 100);
        })
        .getModuloHTML(modulo);
    }

    document.addEventListener('DOMContentLoaded', () => cambiaVista('home'));
  </script>
